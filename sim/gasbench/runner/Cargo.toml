[package]
name = "antosim-gasbench-runner"
version = "0.0.0"
edition = "2021"
description = "Deploys the gasbench contract to a local NEAR sandbox and prints gas per call."
publish = false

[dev-dependencies]
antosim = { path = "../../rust" }
near-workspaces = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
