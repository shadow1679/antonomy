<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antonomy · receipts moved to History</title>
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<meta name="theme-color" content="#14100c">
<link rel="stylesheet" href="app.css">
<script>
  // Receipts is part of History now: the whole-round check sits under each round there.
  (() => {
    const q = new URLSearchParams(location.search);
    const p = new URLSearchParams();
    if (q.has("round")) p.set("round", q.get("round"));
    if (q.has("contract")) p.set("contract", q.get("contract"));
    location.replace(`replay.html${p.size ? `?${p}` : ""}#check`);
  })();
</script>
</head>
<body>
<main class="container page-section">
  <p>Receipts moved to <a href="replay.html#check">History</a>: open a round there and check every hash under it.</p>
</main>
</body>
</html>
