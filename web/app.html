<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antonomy · the nest has its own page</title>
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<meta name="theme-color" content="#14100c">
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0; url=nest.html"></noscript>
<script>
// The nest moved from app.html to nest.html. The query (?contract=) and the
// chamber in the hash (#queen) carry over.
(() => {
  const u = new URL(location.href);
  u.pathname = u.pathname.replace(/app\.html$/, "nest.html");
  location.replace(u);
})();
</script>
</head>
<body>
<p>The nest is now at <a href="nest.html">nest.html</a>.</p>
</body>
</html>
