<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antonomy · randomness, now on the Recruit page</title>
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<meta name="theme-color" content="#14100c">
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0; url=recruit.html#random"></noscript>
<script>
// Randomness moved to the Recruit page (docs/RECRUIT_PAGE.md). ?id= becomes
// ?rnd=; ?c= (the names) and ?contract= stay.
(() => {
  const u = new URL(location.href);
  const id = u.searchParams.get("id");
  u.searchParams.delete("id");
  if (id != null) u.searchParams.set("rnd", id);
  u.pathname = u.pathname.replace(/random\.html$/, "recruit.html");
  u.hash = "#random";
  location.replace(u);
})();
</script>
</head>
<body>
<p>Randomness is now on the <a href="recruit.html#random">Recruit page</a>.</p>
</body>
</html>
