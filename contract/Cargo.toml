[package]
name = "antonomy-contract"
version = "0.0.0"
edition = "2021"
description = "NEAR contract wrapping the antotoken logic: $ANTO ledger, capped burn, pheromone staking. Testnet only."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
antotoken = { path = "../token", features = ["borsh"] }
near-sdk = "5"
# Raw host calls for drand's BLS check: near-sdk's BLS wrappers ignore errors.
near-sys = "0.2"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
